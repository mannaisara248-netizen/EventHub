@switch(categorie()){
    @case('atelier'){
        <span class="badge atelier">Atelier</span>
    }
    @case('conference'){
        <span class="badge conference">Conférence</span>
    }
    @case('competition'){
        <span class="badge competition">Compétition</span>
    }
    @case('sortie'){
        <span class="badge sortie">Sortie</span>
    }
}
